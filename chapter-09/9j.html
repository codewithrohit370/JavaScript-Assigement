<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="p-1" style="height:30px; background-color: aqua;"></p>

     <p>
        <button onclick="
            updateCalculation(1)
        ">1</button>

        <button onclick="
        updateCalculation(2)
        ">2</button>

        <button onclick="
            updateCalculation(3)
        ">3</button>

        <button onclick="
            updateCalculation(' + ')
        ">+</button>
    </p>

    <p>
        <button onclick="
        updateCalculation(4)
        ">4</button>

        <button onclick="
            updateCalculation(5)
        ">5</button>

        <button onclick="
            updateCalculation(6)
        ">6</button>

        <button onclick="
            updateCalculation(' - ')
        ">-</button>
    </p>

    <p>
        <button onclick="
            updateCalculation(7)
        ">7</button>

        <button onclick="
            updateCalculation(8)
        ">8</button>

        <button onclick="
            updateCalculation(9)
        ">9</button>

        <button onclick="
            updateCalculation(' * ')
        ">*</button>
    </p>

     <p>
        <button onclick="
        updateCalculation(0)
        ">0</button>

        <button onclick="
            updateCalculation('.')
        ">.</button>

        <button onclick="
            updateCalculation('=')
        ">=</button>

        <button onclick="
            updateCalculation(' / ')
        ">/</button>
    </p>

    <button onclick="
      calculation = '';
      showCalculation.innerHTML = `${calculation}`;
        localStorage.setItem('calculation', JSON.stringify(calculation));
    ">Clear</button>


    <script>
        let calculation = JSON.parse(localStorage.getItem('calculation')) || '';
        let showCalculation = document.querySelector('.p-1');
         showCalculation.innerHTML = `${calculation}`;

        function updateCalculation(number) {
            if (number === '=') {
                calculation = eval(calculation);
                console.log(calculation);
            } else if (number === '') {
                calculation = "";
                console.log(calculation);
            } else {
                calculation += `${number}`;
                console.log(calculation);
            }
            showCalculation.innerHTML = `${calculation}`;
            localStorage.setItem('calculation', JSON.stringify(calculation));
        }

    </script>
</body>
</html>
