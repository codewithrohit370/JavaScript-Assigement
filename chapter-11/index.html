    <script>
        // 11a
        const nums = [10, 20, 30]
        nums[2] = 99;
        console.log(nums);

        // 11b
        const arr = [1, 20, 22, 24, 5]
        const arr2 = ['rohan', 'rohit ', 'mohit', 'himanshu']
        function getLastValue(arr) {
            return arr[arr.length - 1];
        }
        console.log(getLastValue(arr))
        console.log(getLastValue(arr2))


        // 11c

        function arrSwap(arr) {
            let tamp;
            tamp = arr[0];
            arr[0] = arr[arr.length - 1];
            arr[arr.length - 1] = tamp;
            return arr
        }
        console.log(arrSwap(arr2));

        // 11d
        let i = 0;
        while (i <= 10) {
            if (i % 2 == 0) {
                console.log(i)
            }
            i++;
        }

        // 11e

        for (let newi = 5; newi >= 0; newi--) {
            console.log(newi);
        }

        // 11f
        let i2 = 5;
        while (i2 >= 0) {
            console.log(i2);
            i2--;
        }

        // 11g
        let i3 = 0;
        let newArr = []
        while (i3 < arr.length) {
            newArr.push(arr[i3] + 1);
            i3++;
        }
        console.log(newArr);

        // 11h
        function addOne(arr) {
            let i3 = 0;
            let newArr = []
            while (i3 < arr.length) {
                newArr.push(arr[i3] + 1);
                i3++;
            }
            return newArr
        }
        console.log(addOne([-2, -1, 0, 99]));

        // 11i

        function addNum(arr, num) {
            let i3 = 0;
            let newArr = []
            while (i3 < arr.length) {
                newArr.push(arr[i3] + num);
                i3++;
            }
            return newArr
        }
        console.log(addNum([1, 2, 3], 2));

        // 11j

        function addarr(arr, arr2) {
            let i = 0;
            let newArr = []
            while (i < arr.length) {
                newArr.push(arr[i] + arr2[i]);
                i++;
            }
            return newArr
        }
        console.log(addarr([1, 1, 2], [1, 1, 3]));

        // 11k

        function countPostive(num) {
            let i = 0;
            let count = 0;
            while (i < num.length) {
                if (num[i] > 0) {
                    count++;
                }
                i++;
            }
            return count
        }
        console.log(countPostive([1, -1, 2]));
        console.log(countPostive([-2, 3, -5, 7, 10]));

        // 11l

        function minMax(nums) {
            let i = 0;
            let minValue = nums[0];
            let maxValue = nums[0];
            while (i < nums.length) {
                if (nums[i] > maxValue) {
                    maxValue = nums[i];
                    console.log(maxValue);
                } else if (nums[i] < minValue) {
                    minValue = nums[i];
                    console.log(minValue);
                }
                i++;
            }
            return {
                min: minValue,
                max: maxValue
            }

        }

        console.log(minMax([1, -3, 5]))

        // 11m

        function minMax(nums) {
            let i = 0;
            let minValue = nums[0];
            let maxValue = nums[0];
            if (nums.length === 0) {
                return {
                    min: null,
                    max: null
                }
            } else {
                while (i < nums.length) {

                    if (nums[i] > maxValue) {
                        maxValue = nums[i];
                        console.log(maxValue);
                    } else if (nums[i] < minValue) {
                        minValue = nums[i];
                        console.log(minValue);
                    }

                    i++;
                }
            }
            return {
                min: minValue,
                max: maxValue
            }
        }


        console.log(minMax([1, 6, 8, 4, 8, -35, -299, 220]));

        // 11n

        function countWord(words) {
            let i = 0;
            let ob = {  }
            if (words.length === 0) {
                console.log(`Your Array is Empty`)
            } else {
                while (i < words.length) {
                    const word = words[i];
                    if (!ob[word]) {
                        ob[word] = 1;
                    } else {
                        ob[word]++;
                    }
                    i++;
                }
            }
            return ob
        }

        console.log(countWord(['rohan', 'mohit', 'rohan', 'mohit']));








    </script>
