        // 11r

        function removeEgg(foods) {
            let nonEggArray = []
            for (let i = 0; i < foods.length; i++) {
                if (foods[i] === 'egg') {
                    continue
                } else {
                    nonEggArray.push(foods[i]);
                }
            }
            return nonEggArray;
        }
        console.log(removeEgg(['egg', 'apple', 'egg', 'egg', 'ham']));

        function removeEgg2(food) {
            let nonEggArray = [];
            let countEgg = 0;
            for (let i = 0; i < food.length; i++) {
                if (food[i] === 'egg' && countEgg < 2) {
                    countEgg++;
                    continue
                } else {
                    nonEggArray.push(food[i]);
                }
            }
            return nonEggArray;
        }
        console.log(removeEgg2(['egg', 'apple', 'egg', 'egg', 'ham']));

        // 11w

        function findIndex(array, word) {
            let index = -1
            for (let i = 0; i < array.length; i++) {
                if (array[i] === word) {
                    index = i;
                    break;
                }
            }
            return index;
        }
        console.log(findIndex(['green', 'red', 'blue', 'red'], 'red'));


        function unique(array) {
            const emptyArray = []
            for (let i = 0; i < array.length; i++) {
                const word = array[i];

                if (findIndex(emptyArray, word) === -1) {
                    emptyArray.push(word);
                };
            }
            return emptyArray
        }

        console.log(unique(['green', 'red', 'blue', 'red']));
